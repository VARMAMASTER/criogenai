# cargo-deny: checks every dependency (all features) for known security
# advisories, licenses we can ship under MIT OR Apache-2.0, and crates
# from unknown sources. Run: `cargo deny --all-features check` (the flag
# makes it include optional dependencies such as SQLite).

[graph]
all-features = true

[advisories]
# RustSec advisory database. Vulnerabilities always fail; unmaintained or
# yanked crates are reported for the workspace's own dependency tree.
version = 2
yanked = "deny"
# Each exception says why it is safe and when it goes away.
ignore = [
    # SQLite < 3.54 can return stale page-cache bytes when a process opens a
    # database together with a `-wal` file of another page size that a less
    # trusted party wrote. Criogen only opens its own database files (the
    # application's storage, ~/.criogen/traces.db). The fix is in
    # libsqlite3-sys 0.39, which sqlx does not allow yet (0.8.6: ^0.30.1;
    # 0.9.0: <0.38, and Rust 1.94). Remove when sqlx allows >= 0.39.
    { id = "RUSTSEC-2026-0459", reason = "only our own database files are opened; no sqlx release allows the fixed libsqlite3-sys yet (checked 2026-11-10)" },
]

[licenses]
version = 2
# Permissive licenses only: anything here can ship inside an MIT OR
# Apache-2.0 project, including in commercial products.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Path dependencies between our own crates carry versions, so they are not
# wildcards; private demo and test projects are not checked.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
