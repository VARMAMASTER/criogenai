[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "criogen"
version = "0.1.1"
description = "Agents and workflows on a Rust engine: tools, approvals, durable threads, memory"
readme = "README.md"
requires-python = ">=3.9"
license = "LicenseRef-Criogen-Free"
license-files = ["LICENSE"]
keywords = ["agents", "llm", "workflows", "ai", "tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Framework :: AsyncIO",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://criogen.vercel.app"
Documentation = "https://criogen.vercel.app/docs/"

[project.optional-dependencies]
pydantic = ["pydantic>=2"]
test = ["pytest>=8"]

[tool.maturin]
python-source = "python"
module-name = "criogen._native"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
