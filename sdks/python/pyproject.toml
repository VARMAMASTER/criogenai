[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "criogen"
version = "0.1.3"
description = "The fast AI agent framework for Python, a LangChain and LangGraph alternative on a Rust engine: tool calling, multi-agent workflows, human approval, durable threads, memory"
readme = "README.md"
requires-python = ">=3.9"
license = "LicenseRef-Criogen-Free"
license-files = ["LICENSE"]
keywords = ["ai", "ai-agents", "agent-framework", "llm", "llm-agents", "multi-agent", "agentic", "agent-orchestration", "workflow", "tool-calling", "function-calling", "langchain-alternative", "langgraph-alternative", "openai", "anthropic", "gemini", "rust", "asyncio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Framework :: AsyncIO",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://criogen.vercel.app"
Documentation = "https://criogen.vercel.app/docs/"
Benchmarks = "https://criogen.vercel.app/benchmarks/"

[project.optional-dependencies]
pydantic = ["pydantic>=2"]
test = ["pytest>=8"]

[tool.maturin]
python-source = "python"
module-name = "criogen._native"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
