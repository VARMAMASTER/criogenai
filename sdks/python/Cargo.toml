# The Python SDK's native module (design 0011). Not a workspace member:
# building it needs Python. Built with maturin (see pyproject.toml).
[package]
name = "criogenai-python"
version = "0.1.7"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
criogenai-core = { path = "../../crates/criogenai-core" }
criogenai-providers = { path = "../../crates/criogenai-providers" }
criogenai-storage = { path = "../../crates/criogenai-storage", features = ["sqlite", "postgres", "encryption"] }
criogenai-agent = { path = "../../crates/criogenai-agent", features = ["sqlite", "postgres", "encryption", "mcp-stdio"] }
# The local trace viewer (design 0023).
criogenai-trace = { path = "../../crates/criogenai-trace" }
criogenai-telemetry = { path = "../../crates/criogenai-telemetry" }
# The stable ABI: one wheel for every Python from 3.9.
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
serde = "1"
serde_json = "1"
tokio = { version = "1.45", features = ["rt-multi-thread", "sync", "time"] }

# Stand-alone: never part of the CriogenAI workspace.
[workspace]

# Published binaries carry no symbol table. (Fat LTO made the addon 21%
# smaller but took the build from about 1.5 to 13 minutes: not worth it.)
[profile.release]
strip = "symbols"
