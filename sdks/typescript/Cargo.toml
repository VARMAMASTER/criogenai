# The TypeScript SDK's native addon (design 0012). Not a workspace member:
# building it needs Node. Built with @napi-rs/cli (see package.json).
[package]
name = "agentbuild-node"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
agentbuild-core = { path = "../../crates/agentbuild-core" }
agentbuild-providers = { path = "../../crates/agentbuild-providers" }
agentbuild-storage = { path = "../../crates/agentbuild-storage", features = ["sqlite", "postgres", "encryption"] }
agentbuild-agent = { path = "../../crates/agentbuild-agent", features = ["sqlite", "postgres", "encryption"] }
agentbuild-telemetry = { path = "../../crates/agentbuild-telemetry" }
napi = { version = "3", default-features = false, features = ["napi6", "tokio_rt", "serde-json"] }
napi-derive = "3"
serde = "1"
serde_json = "1"
tokio = { version = "1.45", features = ["rt-multi-thread", "sync", "time"] }

[build-dependencies]
napi-build = "2"

# Stand-alone: never part of the AgentBuild workspace.
[workspace]

# Published binaries carry no symbol table. (Fat LTO made the addon 21%
# smaller but took the build from about 1.5 to 13 minutes: not worth it.)
[profile.release]
strip = "symbols"
