# The TypeScript SDK's engine as WebAssembly (design 0021), for the browser
# and other JavaScript hosts without the Node addon (Web Workers, Deno, edge
# runtimes). Not a workspace member: it builds for wasm32-unknown-unknown
# (scripts/build-web.mjs runs cargo, wasm-bindgen and the bundler).
[package]
name = "criogenai-web"
version = "0.1.7"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
criogenai-core = { path = "../../../crates/criogenai-core" }
criogenai-providers = { path = "../../../crates/criogenai-providers" }
criogenai-storage = { path = "../../../crates/criogenai-storage" }
criogenai-agent = { path = "../../../crates/criogenai-agent" }
criogenai-js = { path = "../../../crates/criogenai-js" }
criogenai-rt = { path = "../../../crates/criogenai-rt" }
serde_json = "1"
# Exact: the glue tool (wasm-bindgen-cli) must be the same version as the
# crate, and these match the workspace's lockfile.
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
js-sys = "=0.3.106"
web-sys = "=0.3.106"

# Stand-alone: never part of the CriogenAI workspace.
[workspace]

# Small to download: optimised for size, one codegen unit, whole-program LTO.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
