# The TypeScript SDK's engine as WebAssembly (design 0021), for the browser
# and other JavaScript hosts without the Node addon (Web Workers, Deno, edge
# runtimes). Not a workspace member: it builds for wasm32-unknown-unknown
# (scripts/build-web.mjs runs cargo, wasm-bindgen and the bundler).
[package]
name = "criogen-web"
version = "0.1.5"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
criogen-core = { path = "../../../crates/criogen-core" }
criogen-providers = { path = "../../../crates/criogen-providers" }
criogen-storage = { path = "../../../crates/criogen-storage" }
criogen-agent = { path = "../../../crates/criogen-agent" }
criogen-js = { path = "../../../crates/criogen-js" }
criogen-rt = { path = "../../../crates/criogen-rt" }
serde_json = "1"
# Exact: the glue tool (wasm-bindgen-cli) must be the same version as the
# crate, and these match the workspace's lockfile.
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
js-sys = "=0.3.106"
web-sys = "=0.3.106"

# Stand-alone: never part of the Criogen workspace.
[workspace]

# Small to download: optimised for size, one codegen unit, whole-program LTO.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
