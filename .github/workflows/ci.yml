name: CI

# Manual only for now: the pipeline runs locally before each push
# (scripts/ci-local.sh). To run it on GitHub again, add back
#   push: { branches: [main] }
#   pull_request:
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets --all-features
      - run: cargo test --doc --workspace --all-features
      - name: without the http feature
        run: |
          cargo test -p agentbuild-providers --no-default-features
          cargo test -p agentbuild-agent --no-default-features

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - run: cargo check --all-targets --all-features

  # Known vulnerabilities (RustSec), licenses and sources of every
  # dependency, including optional ones (deny.toml).
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --all-features
          command: check

  # Projects outside the workspace that call real models by hand (the live
  # check and the demo server): CI only checks that they build and lint.
  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: live check
        run: |
          cargo fmt --manifest-path tests/live/Cargo.toml --check
          cargo clippy --manifest-path tests/live/Cargo.toml -- -D warnings
      - name: demo server
        run: |
          cargo fmt --manifest-path demos/support-chat/server/Cargo.toml --check
          cargo clippy --manifest-path demos/support-chat/server/Cargo.toml -- -D warnings

  # Uses the crate the way a downstream project would: packaged, unpacked,
  # and depended on from a separate project. Also checks the docs build and
  # runs every example (simulated LLM calls, a few seconds each).
  package:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - run: bash scripts/test-package.sh
        shell: bash
      - name: examples
        shell: bash
        run: |
          cargo run -p agentbuild-core --example basic_workflow -- "Hello world"
          cargo run -p agentbuild-core --example approval_workflow -- yes
          cargo run -p agentbuild-core --example llm_workflow -- "remote work"
          cargo run -p agentbuild-core --example retry_workflow
          cargo run -p agentbuild-core --example recover_workflow
          cargo run -p agentbuild-agent --example approval_agent -- edit
          cargo run -p agentbuild-agent --example thread_agent
          cargo run -p agentbuild-agent --features sqlite --example durable_agent
