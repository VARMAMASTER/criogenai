name: CI

# Manual only for now: the pipeline runs locally before each push
# (scripts/ci-local.sh). To run it on GitHub again, add back
#   push: { branches: [main] }
#   pull_request:
on:
  workflow_dispatch:

# Read-only: no job here needs to write to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets --all-features
      - run: cargo test --doc --workspace --all-features
      - name: without the http feature
        run: |
          cargo test -p criogenai-providers --no-default-features
          cargo test -p criogenai-agent --no-default-features

  # The Postgres backend against real servers: the oldest supported
  # version and the newest.
  postgres:
    strategy:
      matrix:
        version: ["13", "18"]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:${{ matrix.version }}
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s
          --health-retries 20
    env:
      CRIOGEN_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
      CRIOGEN_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: >-
          cargo test -p criogenai-storage -p criogenai-agent --all-features
          --test postgres --test memory_store --test durable --test encryption --test retention --test audit

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@360a4e93673de6630fac2478bc9e35244b01a759 # 1.88
      - run: cargo check --all-targets --all-features

  # Known vulnerabilities (RustSec), licenses and sources of every
  # dependency, including optional ones (deny.toml).
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          arguments: --all-features
          command: check

  # LiteLLM was compromised in 2026 through a CI action on a movable tag, a
  # long-lived publishing token and unlocked installs (scripts/check-supply-chain.sh).
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: bash scripts/check-supply-chain.sh

  # Projects outside the workspace that call real models by hand (the live
  # check and the demo server): CI only checks that they build and lint.
  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - name: live check
        run: |
          cargo fmt --manifest-path tests/live/Cargo.toml --check
          cargo clippy --manifest-path tests/live/Cargo.toml -- -D warnings
      - name: demo server
        run: |
          cargo fmt --manifest-path demos/support-chat/server/Cargo.toml --check
          cargo clippy --manifest-path demos/support-chat/server/Cargo.toml -- -D warnings

  # Uses the crate the way a downstream project would: packaged, unpacked,
  # and depended on from a separate project. Also checks the docs build and
  # runs every example (simulated LLM calls, a few seconds each).
  package:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - run: bash scripts/test-package.sh
        shell: bash
      - name: examples
        shell: bash
        run: |
          cargo run -p criogenai-core --example basic_workflow -- "Hello world"
          cargo run -p criogenai-core --example approval_workflow -- yes
          cargo run -p criogenai-core --example llm_workflow -- "remote work"
          cargo run -p criogenai-core --example retry_workflow
          cargo run -p criogenai-core --example recover_workflow
          cargo run -p criogenai-agent --example approval_agent -- edit
          cargo run -p criogenai-agent --example thread_agent
          cargo run -p criogenai-agent --features sqlite --example durable_agent
