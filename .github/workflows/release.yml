name: Release

# Run by hand from the Actions tab (see RELEASING.md). Without "publish" it
# only rebuilds, tests and packages everything: a dry run.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the crates to crates.io (needs the CARGO_REGISTRY_TOKEN secret)"
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: version
        id: version
        run: |
          version="$(cargo pkgid -p criogen-core | sed 's/.*[@#]//')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"
          grep -q "^## \[$version\]" CHANGELOG.md || {
            echo "CHANGELOG.md has no section for $version" >&2
            [ "${{ inputs.publish }}" != "true" ]
          }
      - run: cargo test --workspace --all-features
      - run: bash scripts/test-package.sh
      - name: publish to crates.io
        if: inputs.publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          # Dependency order: each crate needs the ones before it.
          for crate in criogen-core criogen-providers criogen-gateway criogen-storage criogen-agent criogen-telemetry; do
            cargo publish -p "$crate"
          done
      - name: tag and GitHub release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --title "Criogen $VERSION" --notes "See CHANGELOG.md for what is in this release."
