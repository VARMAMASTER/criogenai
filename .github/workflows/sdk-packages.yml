name: SDK packages

# Run by hand from the Actions tab (see RELEASING.md). Builds the Python
# wheels and the npm packages on every platform, tests each on its own
# platform, and keeps them as artifacts. Publishes only with "publish".
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to PyPI (trusted publishing) and npm (needs the NPM_TOKEN secret)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  python:
    name: python ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: "2_28" }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: "2_28" }
          - { os: macos-14, target: aarch64 }
          - { os: macos-15-intel, target: x86_64 }
          - { os: windows-latest, target: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: build the wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --out dist --manifest-path sdks/python/Cargo.toml
      - name: test the wheel in a new venv
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          bin="$RUNNER_TEMP/venv/bin"; [ -d "$bin" ] || bin="$RUNNER_TEMP/venv/Scripts"
          "$bin/python" -m pip install --quiet dist/*.whl pytest
          cp -r sdks/python/tests "$RUNNER_TEMP/tests"
          cd "$RUNNER_TEMP"
          "$bin/python" "$GITHUB_WORKSPACE/sdks/python/examples/consumer.py"
          CRIOGEN_ERROR_CATALOG="$GITHUB_WORKSPACE/schemas/error-codes.json" \
            "$bin/python" -m pytest -q -p no:cacheprovider tests
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  node:
    name: node ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        # Linux builds run in manylinux_2_28 (glibc 2.28), like the wheels, so the
        # addon loads on Vercel, AWS Lambda (glibc 2.34) and any distribution since
        # 2018. Built on a current Ubuntu it needed glibc 2.38 and failed there.
        # An empty image runs the job on the runner itself.
        include:
          - os: ubuntu-latest
            platform: linux-x64
            image: quay.io/pypa/manylinux_2_28_x86_64:2026.10.16-1@sha256:1e7b8460ad8fb3fb0fbe1cd818845159ac896b4fd17452d56e892c291f3b97a8
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            image: quay.io/pypa/manylinux_2_28_aarch64:2026.10.16-1@sha256:b873ffc316ffe8a154e3dc4872871de2ebd170db4876c8bbd983d42ff320001e
          - { os: macos-14, platform: darwin-arm64, image: "" }
          - { os: macos-15-intel, platform: darwin-x64, image: "" }
          - { os: windows-latest, platform: win32-x64, image: "" }
    runs-on: ${{ matrix.os }}
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: build tools for the engine's TLS library (manylinux)
        if: matrix.image != ''
        run: dnf install -y cmake perl-core
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: build and test the package on this platform
        shell: bash
        run: bash scripts/test-typescript.sh
      - name: the addon needs no glibc newer than 2.28
        if: matrix.image != ''
        shell: bash
        run: |
          need="$(objdump -T sdks/typescript/native/criogenai.node | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
          echo "highest glibc symbol: $need"
          top="$(printf '%s\n' GLIBC_2.28 "$need" | sort -V | tail -1)"
          [ "$top" = GLIBC_2.28 ] || { echo "the addon needs $need, newer than glibc 2.28" >&2; exit 1; }
      - name: the platform package
        shell: bash
        run: |
          version="$(node -p "require('./sdks/typescript/package.json').version")"
          out="platform/${{ matrix.platform }}"
          mkdir -p "$out"
          cp sdks/typescript/native/criogenai.node "$out/criogenai.node"
          cp sdks/typescript/LICENSE "$out/"
          os="${{ matrix.platform }}"; os="${os%-*}"; cpu="${{ matrix.platform }}"; cpu="${cpu#*-}"
          cat > "$out/package.json" <<EOF
          {
            "name": "${{ matrix.platform == 'win32-x64' && 'criogenai-windows-x64' || format('criogenai-{0}', matrix.platform) }}",
            "version": "$version",
            "description": "The native addon of criogenai for ${{ matrix.platform }}",
            "license": "SEE LICENSE IN LICENSE",
            "main": "criogenai.node",
            "files": ["criogenai.node", "LICENSE"],
            "os": ["$os"],
            "cpu": ["$cpu"]
          }
          EOF
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-${{ matrix.platform }}
          path: platform/${{ matrix.platform }}

  publish:
    needs: [python, node]
    if: inputs.publish
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: the wheels
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - name: the platform npm packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: npm-*
          path: artifacts
      - name: publish the wheels to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist
      # Nothing is installed or built while a publishing token exists: the
      # main package is prepared first, in a step without secrets, with
      # exact installs (`npm ci`) and no dependency install scripts.
      - name: prepare the main npm package
        run: |
          cd sdks/typescript
          version="$(node -p "require('./package.json').version")"
          # Install and compile first: the lockfile does not list the platform
          # packages, so `npm ci` refuses once they are optional dependencies.
          npm ci --ignore-scripts --no-audit --no-fund
          npx tsc -p tsconfig.json
          # The main package depends on every platform package, optionally.
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json"));
            pkg.optionalDependencies = Object.fromEntries(
              // Windows is criogenai-windows-x64: npm's spam filter refused criogenai-win32-x64.
              ["linux-x64", "linux-arm64", "darwin-arm64", "darwin-x64", "windows-x64"]
                .map((p) => [`criogenai-${p}`, process.argv[1]]));
            pkg.files = pkg.files.filter((f) => !f.startsWith("native"));
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          ' "$version"
      - name: publish the platform packages, then the main one
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Only `npm publish` runs here. Once the packages exist, switch to
          # npm trusted publishing (RELEASING.md) and delete NPM_TOKEN.
          # `--provenance` is added once the repository is public: npm refuses
          # a provenance statement for a private repository.
          for dir in artifacts/npm-*; do
            (cd "$dir" && npm publish --access public)
          done
          (cd sdks/typescript && npm publish --access public)
