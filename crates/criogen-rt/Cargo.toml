[package]
name = "criogen-rt"
description = "Tasks and timers for Criogen: Tokio on servers, the JavaScript event loop in the browser"
readme = "README.md"
keywords = ["agents", "async", "wasm", "runtime"]
categories = ["asynchronous", "wasm"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Not published until the package name is confirmed.
publish = false

# Servers: Tokio's own tasks and timers (`rt`: spawn, JoinSet; `time`:
# sleep, timeouts, and the paused clock the engine's tests run on).
[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
tokio = { workspace = true, features = ["rt", "time"] }

# The browser and other JavaScript hosts (design 0021): tasks on the event
# loop (wasm-bindgen-futures), `setTimeout`, `performance.now()`.
# send_wrapper lets JavaScript values (never `Send`) sit in the engine's
# `Send` futures; the host runs WebAssembly on one thread.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
send_wrapper = { version = "0.6", features = ["futures"] }

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "time", "test-util"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = "0.3"

[lints]
workspace = true
