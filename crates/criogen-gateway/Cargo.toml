[package]
name = "criogen-gateway"
description = "An OpenAI-compatible LLM gateway on Criogen's provider layer"
readme = "README.md"
keywords = ["llm", "gateway", "openai", "proxy", "ai"]
categories = ["web-programming::http-server"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Not published until the package name is confirmed.
publish = false

[dependencies]
criogen-providers = { path = "../criogen-providers", version = "0.1.0" }
# The HTTP server (design 0006 §7). Only this crate depends on it.
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "json", "tokio"] }
# Streams the SSE body from a channel (already in the tree through axum).
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde.workspace = true
serde_json.workspace = true
# Virtual keys are kept as SHA-256 digests (already in the tree through sqlx).
sha2 = "0.10"
thiserror.workspace = true
# `rt-multi-thread`, `net`, `signal`: the binary; `sync`: usage records.
tokio = { workspace = true, features = ["rt-multi-thread", "net", "signal", "sync", "time", "macros"] }
# The config file (design 0006 §12.1).
toml = { version = "0.9", default-features = false, features = ["std", "parse", "serde"] }
uuid.workspace = true

[dev-dependencies]
# Checks usage records against schemas/criogen.schema.json (design 0013).
criogen-agent = { path = "../criogen-agent" }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
# The paused clock, for rate-limit refill timing.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
