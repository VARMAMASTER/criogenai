[package]
name = "criogen-js"
description = "The bridge between Criogen's engine and JavaScript, shared by the Node addon and the WebAssembly module"
readme = "README.md"
keywords = ["agents", "llm", "javascript", "wasm", "napi"]
categories = ["api-bindings", "wasm"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Internal to the TypeScript SDK's two engines (design 0021).
publish = false

[dependencies]
criogen-core = { path = "../criogen-core", version = "0.1.0" }
criogen-providers = { path = "../criogen-providers", version = "0.1.0" }
criogen-storage = { path = "../criogen-storage", version = "0.1.0" }
# `mcp`: tools from MCP servers over HTTP (design 0022), in both engines.
criogen-agent = { path = "../criogen-agent", version = "0.1.0", features = ["mcp"] }
serde.workspace = true
serde_json.workspace = true
# `sync`: the streams' channels and locks.
tokio = { workspace = true, features = ["sync"] }

[features]
# Encrypted databases (the Node addon; never in the browser).
encryption = ["criogen-storage/encryption", "criogen-agent/encryption"]
# MCP servers started as a process (the Node addon; never in the browser).
mcp-stdio = ["criogen-agent/mcp-stdio"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "time", "test-util"] }

[lints]
workspace = true
