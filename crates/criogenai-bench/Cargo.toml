# CriogenAI's benchmarks (design 0014): `cargo run -p criogenai-bench --release`.
# A workspace member so it keeps compiling; never published.
[package]
name = "criogenai-bench"
description = "Benchmarks of CriogenAI's own costs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
# `cargo run -p criogenai-bench` runs the main benchmarks; `--bin vectors` the
# vector search ones (design 0025).
default-run = "criogenai-bench"

[dependencies]
criogenai-core = { path = "../criogenai-core" }
criogenai-providers = { path = "../criogenai-providers" }
criogenai-agent = { path = "../criogenai-agent" }
criogenai-storage = { path = "../criogenai-storage", features = ["sqlite"] }
criogenai-gateway = { path = "../criogenai-gateway" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time"] }

[lints]
workspace = true
