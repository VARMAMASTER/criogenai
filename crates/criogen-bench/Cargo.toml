# Criogen's benchmarks (design 0014): `cargo run -p criogen-bench --release`.
# A workspace member so it keeps compiling; never published.
[package]
name = "criogen-bench"
description = "Benchmarks of Criogen's own costs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
criogen-core = { path = "../criogen-core" }
criogen-providers = { path = "../criogen-providers" }
criogen-agent = { path = "../criogen-agent" }
criogen-storage = { path = "../criogen-storage", features = ["sqlite"] }
criogen-gateway = { path = "../criogen-gateway" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time"] }

[lints]
workspace = true
