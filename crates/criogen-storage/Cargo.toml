[package]
name = "criogen-storage"
description = "Threads, checkpoints and storage backends for Criogen"
readme = "README.md"
keywords = ["agents", "checkpoint", "persistence", "workflow", "llm"]
categories = ["asynchronous", "database"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Not published until the package name is confirmed.
publish = false

# docs.rs documents every feature (e.g. SQLite storage).
[package.metadata.docs.rs]
all-features = true

[dependencies]
criogen-core = { path = "../criogen-core", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# `sync`: the per-thread leases; `time`: `busy_timeout`; `rt`: the
# background pruner (`Storage::spawn_pruner`).
tokio = { workspace = true, features = ["rt", "sync", "time"] }
# Checkpoint ids (v7: ordered by creation time).
uuid.workspace = true
# The audit trail's hash chain (SHA-256). sqlx already depends on it.
sha2 = "0.10"
# The SQL backends (features `sqlite`, `postgres`): async, one crate for
# both. No macros (queries are plain strings, checked by tests); SQLite
# itself is compiled in (bundled), so there is nothing to install.
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio"], optional = true }
# Encryption at rest (feature `encryption`): AES-256-GCM, HKDF and HMAC from
# aws-lc-rs, the library rustls already uses for TLS (no second crypto
# library; a FIPS-validated build exists). base64 for encrypted text and
# stored vectors (SQL backends); sqlx already depends on it. `prebuilt-nasm`: builds on Windows without NASM (as
# rustls does).
aws-lc-rs = { version = "1.18", optional = true, default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"] }
base64 = { version = "0.22", optional = true }

[features]
default = []
# SQLite storage (`SqliteCheckpointer`, `Storage::connect("sqlite://…")`).
sqlite = ["dep:sqlx", "dep:base64", "sqlx/sqlite"]
# Postgres storage (`PostgresCheckpointer`, `Storage::connect("postgres://…")`).
# TLS with rustls on aws-lc-rs, the provider reqwest already uses (no second
# crypto library). Tokio `macros`: each cross-process thread lock
# is held by a task that also listens for interrupts.
postgres = ["dep:sqlx", "dep:base64", "sqlx/postgres", "sqlx/tls-rustls-aws-lc-rs", "tokio/macros"]
# Encryption at rest for the SQL backends (`Keyring`,
# `Storage::connect_encrypted`; design 0008 §15.2).
encryption = ["dep:aws-lc-rs", "dep:base64"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "sync", "test-util"] }

[lints]
workspace = true
