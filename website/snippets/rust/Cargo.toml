# The website's Rust code samples: each src/*.rs file is shown on the site
# between its `// [show]` and `// [/show]` lines, and compiled here
# (`cargo check`) so the docs follow the API. Not a workspace member.
[package]
name = "criogen-website-snippets"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
criogen-core = { path = "../../../crates/criogen-core" }
criogen-providers = { path = "../../../crates/criogen-providers" }
criogen-agent = { path = "../../../crates/criogen-agent", features = ["sqlite", "postgres", "encryption", "mcp-stdio"] }
criogen-storage = { path = "../../../crates/criogen-storage", features = ["sqlite", "postgres", "encryption"] }
criogen-telemetry = { path = "../../../crates/criogen-telemetry" }
criogen-gateway = { path = "../../../crates/criogen-gateway" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
serde_json = "1"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "net"] }

[workspace]
