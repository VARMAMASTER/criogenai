# The website's Rust code samples: each src/*.rs file is shown on the site
# between its `// [show]` and `// [/show]` lines, and compiled here
# (`cargo check`) so the docs follow the API. Not a workspace member.
[package]
name = "criogenai-website-snippets"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
criogenai-core = { path = "../../../crates/criogenai-core" }
criogenai-providers = { path = "../../../crates/criogenai-providers" }
criogenai-agent = { path = "../../../crates/criogenai-agent", features = ["sqlite", "postgres", "encryption", "mcp-stdio"] }
criogenai-storage = { path = "../../../crates/criogenai-storage", features = ["sqlite", "postgres", "encryption"] }
criogenai-telemetry = { path = "../../../crates/criogenai-telemetry" }
criogenai-gateway = { path = "../../../crates/criogenai-gateway" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
serde_json = "1"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "net"] }

[workspace]
