# The website's Rust code samples: each src/*.rs file is shown on the site
# between its `// [show]` and `// [/show]` lines, and compiled here
# (`cargo check`) so the docs follow the API. Not a workspace member.
[package]
name = "agentbuild-website-snippets"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
agentbuild-core = { path = "../../../crates/agentbuild-core" }
agentbuild-providers = { path = "../../../crates/agentbuild-providers" }
agentbuild-agent = { path = "../../../crates/agentbuild-agent", features = ["sqlite", "postgres", "encryption"] }
agentbuild-storage = { path = "../../../crates/agentbuild-storage", features = ["sqlite", "postgres", "encryption"] }
agentbuild-telemetry = { path = "../../../crates/agentbuild-telemetry" }
agentbuild-gateway = { path = "../../../crates/agentbuild-gateway" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
serde_json = "1"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "net"] }

[workspace]
