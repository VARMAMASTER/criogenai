<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="CriogenAI">
  <!-- A rocket whose body is a hexagonal ice-crystal cell, with an amber core and flame.
       Browsers that animate SVG icons (Firefox) show the flame flickering; others show it still. -->
  <style>
    .f { transform-box: fill-box; transform-origin: top center; animation: f 0.9s ease-in-out infinite; }
    .c { transform-box: fill-box; transform-origin: top center; animation: c 0.55s ease-in-out infinite alternate; }
    @keyframes f { 0%, 100% { transform: scale(1, 1); } 25% { transform: scale(0.92, 1.16); } 50% { transform: scale(1.05, 0.9); } 75% { transform: scale(0.96, 1.1); } }
    @keyframes c { from { transform: scale(1, 0.85); } to { transform: scale(0.9, 1.2); } }
    @media (prefers-reduced-motion: reduce) { .f, .c { animation: none; } }
  </style>
  <g stroke-linecap="round" stroke-linejoin="round">
    <path class="f" d="M12.4 24.4 C12.8 27 14.4 28.4 16 31.2 C17.6 28.4 19.2 27 19.6 24.4" fill="#f5b544" fill-opacity=".4" stroke="#f5b544" stroke-width="2"/>
    <path class="c" d="M14.4 24.6 C14.7 26.5 15.3 27.6 16 29.2 C16.7 27.6 17.3 26.5 17.6 24.6 Z" fill="#fbd38a"/>
    <path d="M16 2.5 L21.5 8.5 V22 L16 25 L10.5 22 V8.5 Z" fill="#3ecf8e" fill-opacity=".2" stroke="#3ecf8e" stroke-width="2.4"/>
    <path d="M10.5 16 L6.5 20.5 V24.5 L10.5 22.5 M21.5 16 L25.5 20.5 V24.5 L21.5 22.5" stroke="#3ecf8e" stroke-width="2.2"/>
    <circle cx="16" cy="12.5" r="2.7" fill="#f5b544"/>
  </g>
</svg>
