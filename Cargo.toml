[workspace]
resolver = "3"
members = ["crates/criogen-rt", "crates/criogen-core", "crates/criogen-providers", "crates/criogen-agent", "crates/criogen-telemetry", "crates/criogen-storage", "crates/criogen-gateway", "crates/criogen-bench", "crates/criogen-js"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/VARMAMASTER/criogen"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.40", default-features = false }
uuid = { version = "1.10", default-features = false, features = ["std", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
